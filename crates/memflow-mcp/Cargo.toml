[package]
name = "memflow-mcp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "memflow-mcp"
path = "src/main.rs"

[dependencies]
memflow-core = { path = "../memflow-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"
chrono = "0.4"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "chrono", "uuid", "migrate"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "blocking", "multipart", "stream"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_LibraryLoader"] }
[features]
default = []

[dev-dependencies]
tokio-test = "0.4"