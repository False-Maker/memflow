[package]
name = "memflow-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
memflow-core = { path = "../memflow-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"
chrono = "0.4"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "chrono", "uuid", "migrate"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "blocking", "multipart", "stream"] }
# Fastembed 5.8.1 uses ort 2.0.0-rc.11
fastembed = { version = "5.8.1", default-features = false, features = [
    "hf-hub-rustls-tls",
    "ort-load-dynamic",
    "image-models"
] }

# Explicit ort dependency aligned with fastembed's requirement
ort = { version = "2.0.0-rc.11", default-features = false, features = [
    "std",
    "ndarray",
    "load-dynamic", 
    "copy-dylibs",
    "tls-rustls"
] }



[features]
default = []
