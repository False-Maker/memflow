[package]
name = "memflow-core"
version = "0.1.0"
edition = "2021"
description = "Core logic library for MemFlow - UI-independent business logic"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "chrono", "uuid", "migrate"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1.89"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"

# Time and UUID
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# HTTP client
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "blocking", "multipart", "stream"] }

# Utilities
image = "0.24"
once_cell = "1.19"
regex = "1.10"

# Local embedding model (shared by Tauri & MCP via memflow-core::ai::embedding)
# Note: versions aligned with memflow-mcp's previous direct dependency
fastembed = { version = "5.8.1", default-features = false, features = [
    "hf-hub-rustls-tls",
    "ort-load-dynamic",
    "image-models"
] }
ort = { version = "2.0.0-rc.11", default-features = false, features = [
    "std",
    "ndarray",
    "load-dynamic",
    "copy-dylibs",
    "tls-rustls"
] }

# NLP
jieba-rs = "0.7"

# Clipboard
arboard = "3.4"

# Directories
dirs = "5.0"

# Input device monitoring (for focus analytics)
device_query = "0.2.4"

# Scope guard for RAII patterns
scopeguard = "1.2"

# IPC support (tokio already includes io utilities)
futures-util = "0.3"

# Screen capture (for collection module)
xcap = "0.2"
webp = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi"
] }

[dev-dependencies]
criterion = "0.5"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
